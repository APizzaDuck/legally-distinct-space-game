<html>
<head>
<title> legally distinct space game </title>
<script src="https://simplycodingcourses.com/files/simply.js"></script>
<script>
function start(){
sjs.open("target",800,500);


// text COPILOT I SAID FUCK OFF YOU PIECE OF SHIT CLANKER

var hpText = new sjs.Text("HP: 5", 20, "red");
hpText.right();
var scoreText = new sjs.Text("Score: 0", 20, "white");
scoreText.right();
scoreText.offset(0, 75);
// note to self: gemini is not to be trusted with coding. aint no clanker that can make my spaghetti code. i am one in a krillion.
 // stars
  setInterval(function(){

    var star = new sjs.Image("Images/star.png");
    star.setSize(5,5);
    star.friction = 0;
    star.type = "star";
    star.noBounds = true;

    var starOffsetX = Math.round(Math.random()*800);
    var starOffsetY = Math.round(Math.random()*50);

    star.offset(starOffsetX, starOffsetY);

    star.pushDown(3);
}, 250 );

sjs.onHit("star", "bottom_screen", function(x,y){
  x.destroy();
});
var score = 0;
// player

  var player = new sjs.Image("Images/ship.gif.gif");
  player.setSize(75,75);
  player.friction = .30;
  player.type = "player";
  player.centerH();
  player.bottom();

  sjs.keyDown(W_KEY, function(){

    player.pushUp(3);

  });

  sjs.keyDown(S_KEY, function(){

    player.pushDown(3);

  });

  sjs.keyDown(A_KEY ,function(){

    player.pushLeft(3);

  });

  sjs.keyDown(D_KEY, function(){

    player.pushRight(3);

  });

  // laser
  canShoot = true;

  sjs.keyDown(SPACE_KEY, function(){

    if (canShoot == true) {
      var laser = new sjs.Image("Images/laser.png.png");
      laser.setSize(60, 60);
      laser.friction = 0
      laser.type = "laser";
      laser.moveTo(player.getX(), player.getY());
      laser.pushUp(6);
      canShoot = false;
    } else {
      setTimeout(function(){
        canShoot = true;
      }, 500);
    }
  });
    

  // enemies

   setInterval(function(){

    var enemy = new sjs.Image("Images/enemy.gif.gif");
    enemy.friction = 0;
    enemy.type = "enemy";
    enemy.setSize(75, 75);
    enemy.noBounds = true;

    var enemyOffsetX = Math.round(Math.random()*800);
    var enemyOffsetY = Math.round(Math.random()*50);


    enemy.offset(enemyOffsetX, enemyOffsetY);


    enemy.pushDown(3);
    
  




}, 1000 );


var hitPoints = 5;


  // FUCK OFF COPILOT (aka honhits)
 
    sjs.onHit("player", "enemy" ,function (x,y){
      y.destroy();
      hitPoints = hitPoints - 1;
      hpText.setText("HP: "+hitPoints);
      if (hitPoints <= 0) {
        window.location = 'gameover.html';
      }
    });

    sjs.onHit("enemy", "bottom_screen", function(x,y){
      x.destroy();
      hitPoints = hitPoints - 1;
      hpText.setText("HP: "+hitPoints);
      if (hitPoints <= 0) {
        window.location = 'gameover.html';
      }
    });

    sjs.onHit("enemy", "laser", function(x,y){
      x.destroy();
      y.destroy();
      score = score + 1;
      scoreText.setText("Score: "+score);
    });

    sjs.onHit("laser", "top_screen", function(x,y){
      x.destroy();
    });

} //end start
</script>
</head>
<body onload="start()">
<h1> legally distinct space game </h1>

<div id="target" style="margin:auto;background:rgb(0, 0, 0);"></div>
</body>
</html>
